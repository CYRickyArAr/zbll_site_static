    <script>
        (function () {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            try {
                var saved = localStorage.getItem('zbll_theme');
                var theme = saved === 'light' || saved === 'dark' ? saved :
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                var filter = localStorage.getItem('zbll_filter');
                document.documentElement.setAttribute('data-zbll-filter', filter === 'learned' || filter === 'unlearned' ? filter : 'all');
                var hash = location.hash || '#/';
                var key = 'zbll_scroll_' + (hash.match(/^#\/category\/([A-Za-z]+)$/) ? 'cat:' + hash.match(/^#\/category\/([A-Za-z]+)$/)[1] : 'home');
                var hasAnchor = !!localStorage.getItem(key + '_anchor');
                var y = parseInt(localStorage.getItem(key), 10) || 0;
                if (hasAnchor || y > 0) document.documentElement.setAttribute('data-scroll-restore', 'pending');
                var snapshotRaw = sessionStorage.getItem('zbll_render_snapshot_v1');
                if (snapshotRaw) {
                    var snapshot = JSON.parse(snapshotRaw);
                    if (snapshot && snapshot.hash === hash && snapshot.appHtml) {
                        document.documentElement.setAttribute('data-render-snapshot', 'pending');
                    }
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-zbll-filter', 'all');
            }
        })();
    </script>

    <!-- 页面内容 -->
    <div class="main-content">
        <div id="app"></div>
    </div>
    <script>
        (function () {
            try {
                var raw = sessionStorage.getItem('zbll_render_snapshot_v1');
                if (!raw) return;
                var snapshot = JSON.parse(raw);
                var hash = location.hash || '#/';
                if (!snapshot || snapshot.hash !== hash || !snapshot.appHtml) return;
                var app = document.getElementById('app');
                if (!app) return;
                app.innerHTML = snapshot.appHtml;
                if (snapshot.nav) {
                    var publicBtn = document.getElementById('nav-public-mode');
                    var workspaceBtn = document.getElementById('nav-workspace-mode');
                    var workspaceOpen = document.getElementById('workspace-open');
                    if (publicBtn) publicBtn.classList.toggle('active', !!snapshot.nav.publicActive);
                    if (workspaceBtn) {
                        workspaceBtn.classList.toggle('active', !!snapshot.nav.workspaceActive);
                        if (snapshot.nav.workspaceTitle) workspaceBtn.title = snapshot.nav.workspaceTitle;
                    }
                    if (workspaceOpen && snapshot.nav.workspaceOpenHtml) {
                        workspaceOpen.innerHTML = snapshot.nav.workspaceOpenHtml;
                        workspaceOpen.title = snapshot.nav.workspaceOpenTitle || '';
                        workspaceOpen.className = snapshot.nav.workspaceOpenClass || workspaceOpen.className;
                    }
                }
                document.body.classList.add('zbll-has-snapshot');
                document.documentElement.style.scrollBehavior = 'auto';
                document.body.style.scrollBehavior = 'auto';
                var targetY = Number(snapshot.scrollY) || 0;
                if (snapshot.anchor && snapshot.anchor.id) {
                    var anchorEl = document.getElementById(snapshot.anchor.id);
                    if (anchorEl) {
                        var nav = document.querySelector('.navbar');
                        var navOffset = (nav ? nav.offsetHeight : 60) + 8;
                        targetY = Math.max(0, window.pageYOffset + anchorEl.getBoundingClientRect().top - navOffset - (Number(snapshot.anchor.offset) || 0));
                    }
                }
                window.scrollTo(0, targetY);
                document.documentElement.removeAttribute('data-render-snapshot');
            } catch (e) {}
        })();
    </script>

    <div class="workspace-overlay" id="workspace-overlay" hidden>

                        <div id="workspace-public-list" class="workspace-list workspace-public-list"></div>
                    </section>
                </div>
                <div class="workspace-panel-column">
                    <section class="workspace-custom-section" aria-labelledby="workspace-custom-title">

                            </button>
                        </div>
                        <div id="workspace-list" class="workspace-list"></div>
                    </section>

            </div>
            <div id="workspace-progress" class="workspace-progress" hidden>
                <div class="workspace-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="workspace-progress-bar"></div></div>
                <div class="workspace-progress-meta">
                    <div class="workspace-progress-text"></div>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="workspace-export-cancel" hidden>取消导出</button>
                </div>
            </div>
        </div>
        <div class="workspace-context-menu" id="workspace-context-menu" role="menu" hidden>
            <div data-context-group="public">
                <button type="button" class="workspace-context-action" id="workspace-public-rename" role="menuitem"><span>重命名</span><kbd>F2</kbd></button>

                <button type="button" class="workspace-context-action is-danger" id="workspace-public-delete" role="menuitem"><span>删除</span><kbd>Del</kbd></button>
            </div>
            <div data-context-group="custom" hidden>

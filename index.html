    <script>
        (function () {
            if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
            try {
                var saved = localStorage.getItem('zbll_theme');
                var theme = saved === 'light' || saved === 'dark' ? saved :
                    (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                var filter = localStorage.getItem('zbll_filter');
                document.documentElement.setAttribute('data-zbll-filter', filter === 'learned' || filter === 'unlearned' ? filter : 'all');
                var hash = location.hash || '#/';
                var key = 'zbll_scroll_' + (hash.match(/^#\/category\/([A-Za-z]+)$/) ? 'cat:' + hash.match(/^#\/category\/([A-Za-z]+)$/)[1] : 'home');
                var hasAnchor = !!localStorage.getItem(key + '_anchor');
                var y = parseInt(localStorage.getItem(key), 10) || 0;
                if (hasAnchor || y > 0) document.documentElement.setAttribute('data-scroll-restore', 'pending');
                var snapshotRaw = sessionStorage.getItem('zbll_render_snapshot_v5');
                if (snapshotRaw) {
                    var snapshot = JSON.parse(snapshotRaw);
                    if (snapshot && snapshot.language === ZBLL_I18N.language() && snapshot.hash === hash && snapshot.appHtml) {
                        document.documentElement.setAttribute('data-render-snapshot', 'pending');
                    }
                }
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
                document.documentElement.setAttribute('data-zbll-filter', 'all');
            }
        })();
    </script>

    <script>
        (function () {
            try {
                ZBLL_I18N.translate(document);
                var raw = sessionStorage.getItem('zbll_render_snapshot_v5');
                if (!raw) return;
                var snapshot = JSON.parse(raw);
                var hash = location.hash || '#/';
                if (!snapshot || snapshot.language !== ZBLL_I18N.language() || snapshot.hash !== hash || !snapshot.appHtml) return;
                var app = document.getElementById('app');
                if (!app) return;
                app.innerHTML = snapshot.appHtml;
                if (snapshot.nav) {
                    var workspaceOpen = document.getElementById('workspace-open');
                    if (workspaceOpen && snapshot.nav.workspaceOpenHtml) {
                        workspaceOpen.innerHTML = snapshot.nav.workspaceOpenHtml;
                        workspaceOpen.title = snapshot.nav.workspaceOpenTitle || '';
                        workspaceOpen.className = snapshot.nav.workspaceOpenClass || workspaceOpen.className;
                    }
                }
                document.body.classList.add('zbll-has-snapshot');
                document.documentElement.style.scrollBehavior = 'auto';
                document.body.style.scrollBehavior = 'auto';
                var targetY = Number(snapshot.scrollY) || 0;
                if (snapshot.anchor && snapshot.anchor.id) {
                    var anchorEl = document.getElementById(snapshot.anchor.id);
                    if (anchorEl) {
                        var nav = document.querySelector('.navbar');
                        var caseBar = document.querySelector('.case-bar');
                        var navOffset = (nav ? nav.offsetHeight : 60) + (caseBar ? caseBar.offsetHeight : 0) + 8;
                        targetY = Math.max(0, window.pageYOffset + anchorEl.getBoundingClientRect().top - navOffset - (Number(snapshot.anchor.offset) || 0));
                    }
                }
                window.scrollTo(0, targetY);
                document.documentElement.removeAttribute('data-render-snapshot');
            } catch (e) {}
        })();
    </script>
